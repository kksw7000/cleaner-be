spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./cleaner-be/.env[.properties]"
  application:
    name: be
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    baseline-version: 3
    baseline-on-migrate: false
    # 프로필별 경로에서 빠진 반복 마이그레이션을 무시하므로 누락 여부를 별도로 확인해야 합니다.
    ignore-migration-patterns:
      - repeatable:missing
    postgresql:
      transactional-lock: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# JWT_SECRET must be Base64-encoded and decode to at least 32 bytes.
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: PT30M
  refresh-token-validity: P14D
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE}
  refresh-cookie-same-site: ${JWT_REFRESH_COOKIE_SAME_SITE}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}